# The two targets the app ships for.
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "GPL-3.0-or-later", "GPL-3.0-only", "0BSD", "CC0-1.0", "BSL-1.0", "ISC", "MPL-2.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# Unmaintained, not vulnerable, and only reachable through Slint (no other path in our graph); drop when Slint does.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, used by i-slint-core only" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained, used by slint-macros (build time) only" },
    # Linux only: the tray's D-Bus stack (ksni -> zbus) and winit's Wayland decorations.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, used by zbus under ksni (Linux tray)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, used by zbus under ksni (Linux tray)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, used by zbus under ksni (Linux tray)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, used by winit's Wayland title bar (sctk-adwaita)" },
    # cargo-deny merges both targets' graphs: tray-icon's Linux gtk stack appears though we only use it on Windows.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, via gtk under tray-icon, which we build for Windows only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
